[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridle-sdk"
version = "0.1.0"
description = "Minimal client SDK for routing agent payments through a Bridle relay."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "stellar-sdk>=11.0.0"]

[tool.setuptools.packages.find]
include = ["bridle_sdk*"]
